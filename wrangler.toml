compatibility_date = "2023-10-16"
main = "src/index.ts"
name = "r2-webdav"
workers_dev = false
preview_urls = false

compatibility_flags = ["nodejs_compat"]

# Bind an R2 Bucket. Use R2 to store arbitrarily large blobs of data, such as files.
# Docs: https://developers.cloudflare.com/r2/api/workers/workers-api-usage/
[[r2_buckets]]
binding = "bucket" # <~ valid JavaScript variable name
bucket_name = "webdav"

[vars]
SIDECAR_PREFIX = ".__sidecar__"

# WebDAV mutation coordinator. A single Durable Object instance serializes
# shared/exclusive guards across Workers isolates, including the root path.
[[durable_objects.bindings]]
name = "MUTATION_GUARD"
class_name = "MutationGuardDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MutationGuardDurableObject"]

# Docs: https://developers.cloudflare.com/workers/observability/logs/workers-logs/#enable-workers-logs
[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"
